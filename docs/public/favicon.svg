<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- XZ Cyan/Blue Gradient -->
    <linearGradient id="xz-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Zig Amber/Orange Gradient -->
    <linearGradient id="zig-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Glow/Shadow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
    <filter id="zig-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Stylized X crossing strokes -->
  <path d="M 18 17 L 46 47" 
        stroke="url(#xz-grad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        filter="url(#glow)"/>
  <path d="M 46 17 L 18 47" 
        stroke="url(#xz-grad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        filter="url(#glow)"/>

  <!-- High-speed Zig lightning accent in center -->
  <path d="M 35 12 L 23 31 L 32 31 L 26 49 L 43 27 L 33 27 Z" 
        fill="url(#zig-grad)" 
        filter="url(#zig-glow)"/>
</svg>